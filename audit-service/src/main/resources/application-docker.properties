spring.application.name=audit-service

spring.datasource.url=jdbc:postgresql://postgres:5432/${AUDIT_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8082

spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${AUDIT_KAFKA_GROUP_ID}
spring.kafka.consumer.auto-offset-reset = earliest